name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Offline checks
        run: |
          python -m unittest discover -s tests -v
          ahat-benchmark doctor
          python examples/offline_demo.py
          python scripts/check_release.py
          python scripts/export_public.py --output-dir outputs/ci-public-export
      - name: Build and inspect distributions
        run: |
          python -m build
          python scripts/check_release.py --artifacts dist/*
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ahat-wheel-env"
          "$RUNNER_TEMP/ahat-wheel-env/bin/python" -m pip install dist/*.whl
          cp -r examples "$RUNNER_TEMP/ahat-wheel-examples"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ahat-wheel-env/bin/python" -I -m ahat_benchmark doctor
          "$RUNNER_TEMP/ahat-wheel-env/bin/python" -I ahat-wheel-examples/offline_demo.py --output-dir ahat-wheel-output
